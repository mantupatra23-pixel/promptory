name: Daily Autonomous AI Prompt Ingestion

on:
  schedule:
    - cron: '0 0 * * *' # Har roz 00:00 UTC ko run hoga
  workflow_dispatch:     # GitHub UI se manually run karne ka option

jobs:
  ingest-prompts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Run Groq AI Generator & Ingest to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/auto_generator.mjs
